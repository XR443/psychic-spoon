<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интерактивный калькулятор</title>
    <link rel="stylesheet" href="practice_4_style.css">
</head>
<body>
    <div class="calculator">
        <h1>Калькулятор</h1>

        <div class="inputs">
            <input type="text" id="num1" placeholder="Введите первое число">
            <input type="text" id="num2" placeholder="Введите второе число">
        </div>

        <div class="buttons">
            <button id="btn-sum">Сумма</button>
            <button id="btn-diff">Разность</button>
            <button id="btn-mult">Произведение</button>
            <button id="btn-div">Деление</button>
        </div>

        <div class="result-window">
            <span id="result">Результат</span>
        </div>
    </div>

    <script src="practice_4_script.js"></script>
</body>
</html>
