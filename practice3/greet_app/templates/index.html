<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приветствие</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(330deg, #222 0%, #444 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #eaeaea;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 8px;
            font-size: 26px;
            letter-spacing: 0.3px;
        }

        .subtitle {
            color: #a8a8a8;
            font-size: 15px;
            margin-bottom: 28px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        input[type="text"] {
            padding: 14px 16px;
            font-size: 16px;
            color: #f0f0f0;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        input[type="text"]::placeholder {
            color: #888;
        }

        input[type="text"]:focus {
            border-color: #999;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08);
        }

        button {
            padding: 14px 16px;
            font-size: 16px;
            font-weight: 600;
            color: #f5f5f5;
            background: linear-gradient(360deg, #444 0%, #999 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
            filter: brightness(1.15);
        }

        button:active {
            transform: translateY(0);
            filter: brightness(0.95);
        }

        .greeting {
            margin-top: 26px;
            padding: 18px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            animation: fadeIn 0.4s ease;
        }

        .greeting.error {
            background: rgba(192, 57, 43, 0.18);
            border-color: rgba(192, 57, 43, 0.45);
            color: #ff8b7d;
            font-size: 16px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Добро пожаловать!</h1>
    <p class="subtitle">Введите своё имя, чтобы получить приветствие</p>

    <form method="post" action="{% url 'greet_app:index' %}">
        {% csrf_token %}
        <input
                type="text"
                name="name"
                placeholder="Ваше имя..."
                value="{{ name }}"
                maxlength="50"
                autocomplete="off"
                required
        >
        <button type="submit">Submit</button>
    </form>

    {% if user %}
    <div class="greeting">
        Привет, <span class="name">{{ user.name }}</span>!
    </div>
    {% elif error %}
    <div class="greeting error">{{ error }}</div>
    {% endif %}
</div>
</body>
</html>
